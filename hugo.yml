baseURL: https://norbmor.netlify.app/
languageCode: en-us
title: Norberto Moreno-Quibén's Web Page
author: Norberto Moreno-Quibén
theme: paper-mod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Norberto Moreno-Quibén's Web Page
  description: "Academic web page by Norberto Moreno-Quibén"
  keywords: [Blog, Portfolio, academic, linguistics]
  author: Norberto Moreno-Quibén
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  profileMode:
    enabled: true
    title: "Norberto Moreno-Quibén"
    subtitle: "Profesor Ayudante Doctor in Spanish Linguistics · Vicedean of Research and Student Affairs, Facultad de Filosofía y Letras, Universidad de Alcalá"
    buttons:
      - name: Curriculum Vitae
        url: /cv/
      - name: Research
        url: /research/
      - name: Teaching
        url: /teaching/

  socialIcons:
    - name: github
      url: "https://github.com/norbmor"
    - name: email
      url: "mailto:quiben@fastmail.com"

menu:
  main:
    - name: Curriculum Vitae
      url: /cv/
      weight: 10
    - name: Research
      url: /research/
      weight: 20
    - name: Teaching
      url: /teaching/
      weight: 30
