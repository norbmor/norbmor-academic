{{ define "main" }}
<main>
  <div class="container">
    <div class="row mt-5">
      <div class="col">
        <div class="text-center pb-3">
          <h1 class="text-primary">{{ .Page.Title }}</h1>
          {{- with .Params.subtitle -}}
          <h2 class="text-secondary h3">{{ . }}</h2>
          {{- end -}}
        </div>
        {{ .Content }}
      </div>
    </div>
  </div>
</main>
<hr class="border border-secondary">
{{ end }}
